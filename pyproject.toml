[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyfrac"
version = "0.2.0"
description = "Exact polynomial and rational-function arithmetic over Q, with Sturm-sequence real-root counting. No floating point."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sturm", "polynomial", "exact-arithmetic", "rational-functions", "real-root-counting", "formal-methods"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
